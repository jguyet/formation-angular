<mat-card class="example-card" appearance="outlined">
    <mat-card-header>
      <img mat-card-image [src]="'miel_' + card?.type + '.png'" [alt]="card?.title">
      <div class="card-title">{{ card?.title }}</div>
    </mat-card-header>
    <mat-card-content>
      <p>
        {{ card?.description }}
      </p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button>LIKE</button>
      <button mat-button>SHARE</button>
    </mat-card-actions>
  </mat-card>
