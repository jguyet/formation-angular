
<form (ngSubmit)="submit()" [formGroup]="formGroup">

    <h4>Title</h4>
    <input type="text" formControlName="title" />
    <div *ngIf="formGroup.hasError('empty', 'title')">
        {{ formGroup.getError('empty', 'title') }}
    </div>
    <div *ngIf="formGroup.hasError('exists', 'title')">
        {{ formGroup.getError('exists', 'title') }}
    </div>
    
    <h4>Description</h4>
    <input type="text" formControlName="description" />

    <h4>Price</h4>
    <input type="number" formControlName="price" />

    <h4>Type</h4>
    <select formControlName="type">
        <option value="blue">blue</option>
        <option value="dark">dark</option>
        <option value="green">green</option>
        <option value="orange">orange</option>
        <option value="purple">purple</option>
        <option value="red">red</option>
        <option value="yellow">yellow</option>
    </select>

    @if (loading) {
        ... chargement
    } @else {
        <button type="submit" [disabled]="formGroup.invalid">Submit</button>
    }
</form>
